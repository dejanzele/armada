name: Disk Space Experiment

on:
  push:
    branches:
      - ci/disk-experiment

permissions:
  contents: read

jobs:
  small-runner-sim:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 17 = what a 73GB runner has at job start (no fix, expected FAIL)
        # 36 = what a 73GB runner has after the free-disk-space step (fix, expected PASS)
        target-free-gb: [17, 36]
    env:
      ARMADA_EXECUTOR_INGRESS_URL: "http://localhost"
      ARMADA_EXECUTOR_INGRESS_PORT: 5001
      DOCKER_BUILDX_BUILDER: "builder"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Baseline disk usage and start sampler
        run: |
          echo "=== baseline ==="
          df -h /
          nohup bash -c 'while true; do echo "$(date -u +%H:%M:%S) ROOT_AVAIL_MB=$(df -m --output=avail / | tail -1 | tr -d " ")" >> /tmp/disk-samples.log; sleep 10; done' >/dev/null 2>&1 &
          echo "sampler started"

      - name: Ballast disk down to simulate 73GB runner scenario
        run: |
          TARGET_MB=$(( ${{ matrix.target-free-gb }} * 1024 ))
          AVAIL_MB=$(df -m --output=avail / | tail -1 | tr -d ' ')
          BALLAST=$(( AVAIL_MB - TARGET_MB ))
          if [ "$BALLAST" -gt 0 ]; then
            sudo fallocate -l ${BALLAST}M /ballast
          fi
          echo "=== after ballast ==="
          df -h /

      - name: Setup Docker
        uses: docker/setup-docker-action@1a6edb0ba9ac496f6850236981f15d8f9a82254d # v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":false}}'

      - run: docker buildx create --name ${DOCKER_BUILDX_BUILDER} --driver docker-container --use
      - run: docker buildx install

      - name: Setup Go
        uses: ./.github/actions/setup-go-cache
        with:
          cache-prefix: airflow-integration-tests
          cache-tools: true

      - name: Setup integration environment
        run: |
          mkdir -p .kube/internal
          mkdir -p .kube/external
          go run github.com/magefile/mage@v1.15.0 -v localdev minimal

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          version: '23.3'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run airflow e2e tests
        run: go run github.com/magefile/mage@v1.15.0 -v teste2eAirflow

      - name: Final disk report
        if: always()
        run: |
          echo "=== df ==="
          df -h /
          echo "=== docker system df ==="
          docker system df || true
          echo "=== disk availability timeline (MB) ==="
          cat /tmp/disk-samples.log || true
          echo "=== min avail ==="
          grep -o 'ROOT_AVAIL_MB=[0-9]*' /tmp/disk-samples.log | sed 's/.*=//' | sort -n | head -1
